appId: io.github.jlesak.intersect
productName: Intersect

directories:
  buildResources: build

# main points at out/ (electron-vite build output); source, tests, and build config
# are never read at runtime, so they are excluded from the bundle. Negation-only patterns
# are appended to electron-builder's default "**/*" inclusion.
files:
  - '!.vscode/**'
  - '!src/**'
  - '!e2e/**'
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!eslint.config.js'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{vitest.config.ts,playwright.config.ts}'
  - '!{README.md,AGENTS.md,CLAUDE.md}'
  # The TODO reminder addon's sources and node-gyp output. build:native copies the one built file
  # to out/native, which ships.
  - '!native/**'
  # Agent tooling and its scratch: .claude also holds settings.local.json and other worktrees.
  - '!{.agents,.agent-runs,.claude,.codex,.lavish,.serena}/**'

# Two native modules ship. node-pty's pty.node and spawn-helper must live on disk outside the
# asar archive so (a) electron-builder can sign them and (b) node-pty's own runtime path rewrite
# (app.asar -> app.asar.unpacked in unixTerminal.js) can locate spawn-helper. Without this the app
# launches but every terminal fails to spawn. The TODO reminder addon (native/todo-reminders,
# built by `npm run build:native` into out/native) is unpacked for the same signing reason, and
# because a native library cannot be loaded from inside the archive; src/main/todoReminders/
# native.ts loads it from app.asar.unpacked.
asarUnpack:
  - node_modules/node-pty/**
  - out/native/**
  # Claude launches these three MCP servers as `node <path>`, outside Electron. Plain Node cannot
  # read inside app.asar, so the bundles and the chunks they share must also exist as ordinary
  # files. hookHelper.js is deliberately absent: it runs under the Electron binary with
  # ELECTRON_RUN_AS_NODE=1, which keeps Electron's asar-aware fs and reads straight from the archive.
  - out/main/draftServer.js
  - out/main/jiraReportServer.js
  - out/main/otoReportServer.js
  - out/main/chunks/**
  # The MCP SDK is bundled into those outputs, but `require("ajv-formats")` survives bundling, and
  # resolving it walks out of the unpacked tree into node_modules. ajv-formats carries its own ajv 8
  # and json-schema-traverse; ajv 8's other three dependencies are hoisted to the top level and are
  # named here. Verified by loading ajv-formats and compiling a format-using schema from a copy of
  # this exact set, with nothing else above it.
  - node_modules/ajv-formats/**
  - node_modules/fast-deep-equal/**
  - node_modules/fast-uri/**
  - node_modules/require-from-string/**

# node-pty ships ABI-stable N-API prebuilds, and the reminder addon is compiled by
# `npm run build:native` before electron-builder runs; there is nothing for it to rebuild.
npmRebuild: false

mac:
  # dir = the raw .app bundle only (no dmg/zip), built for this machine's arch.
  target:
    - target: dir
      arch: arm64
  category: public.app-category.developer-tools
  # Ad-hoc signature: valid only on the machine that produced the build. No Apple
  # Developer account or notarization. Hardened runtime is disabled because its library
  # validation would reject node-pty's binaries (signed ad-hoc, not with Electron's team
  # id) and kill terminal spawning; hardened runtime only matters for notarization, which
  # a personal, machine-local build never undergoes.
  identity: '-'
  hardenedRuntime: false
